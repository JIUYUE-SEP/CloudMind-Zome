name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build engine and web
        run: |
          pnpm --filter @mindcloud/shared build
          pnpm --filter @mindcloud/engine build
          pnpm --filter @mindcloud/web build

      - name: Rust checks
        run: |
          cd crates/zome-sidecar
          cargo fmt --check
          cargo clippy -vv -- -D warnings
          cargo test -vv
          cargo build --release -vv

      # Rust 依赖漏洞审计（P5-5）：两个 crate 的 Cargo.lock 分别扫描
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Cargo audit (zome-sidecar)
        run: cargo audit
        working-directory: crates/zome-sidecar

      # quick-xml 两条 high（RUSTSEC-2026-0194/0195）暂无修复路径：plist 1.9.0
      # 锁定 quick-xml 0.39.x，补丁只发在 ≥0.41.0；攻击面为构建期 plist 解析
      # （非运行时不可信输入）。显式忽略已评估项，其余漏洞（含新增）仍然 fail。
      - name: Cargo audit (desktop src-tauri)
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
        working-directory: apps/desktop/src-tauri

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./services/engine/coverage/lcov.info
          flags: engine
          name: engine-coverage
          fail_ci_if_error: false

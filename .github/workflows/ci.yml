name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # F15：显式登记缓存工作区——默认 workspaces="." 下本仓库根
          # 无 Cargo.toml，编译产物 target/ 不进缓存
          workspaces: |
            crates/zome-sidecar -> target

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build engine and web
        run: |
          pnpm --filter @cloudmind/shared build
          pnpm --filter @cloudmind/engine build
          pnpm --filter @cloudmind/web build

      - name: Rust checks
        run: |
          cd crates/zome-sidecar
          cargo fmt --check
          cargo clippy -vv -- -D warnings
          cargo test -vv
          cargo build --release -vv

      # Rust 依赖漏洞审计（P5-5）
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Cargo audit (zome-sidecar)
        run: cargo audit
        working-directory: crates/zome-sidecar

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./services/engine/coverage/lcov.info
          flags: engine
          name: engine-coverage
          fail_ci_if_error: false

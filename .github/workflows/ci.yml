name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # F15：显式登记缓存工作区——默认 workspaces="." 下本仓库根
          # 无 Cargo.toml，编译产物 target/ 不进缓存
          workspaces: |
            crates/zome-sidecar -> target

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build engine and web
        run: |
          pnpm --filter @cloudmind/shared build
          pnpm --filter @cloudmind/engine build
          pnpm --filter @cloudmind/web build

      - name: Rust checks
        run: |
          cd crates/zome-sidecar
          cargo fmt --check
          cargo clippy -vv -- -D warnings
          cargo test -vv
          cargo build --release -vv

      # Rust 依赖漏洞审计（P5-5）
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Cargo audit (zome-sidecar)
        # 配置在 crates/zome-sidecar/.cargo/audit.toml：只放「无修复版本且已评估」的项
        # （当前仅 bincode 的 unmaintained 公告），有修复版本的一律升级依赖解决
        run: cargo audit --config .cargo/audit.toml
        working-directory: crates/zome-sidecar

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./services/engine/coverage/lcov.info
          flags: engine
          name: engine-coverage
          fail_ci_if_error: false

  # 平台差异兜底（2026-11-01 review H-3）：Windows 才是实际运行环境，而路径
  # 分隔符 / `.exe` 后缀 / SIGTERM 语义 / pnpm 的 `.cmd` shim 在 ubuntu 上永远绿。
  # 2026-11-01 之前 sidecar 自启的 4 个用例在 Windows 长期红（测试硬编码 POSIX
  # 路径 + 忽略 taskkill 分支），正是单平台 CI 看不见的盲区。
  # 只跑两端测试（跳过 cargo / 构建链），把差异挡在合并前，时长可控。
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # engine 测试直接 import @cloudmind/shared 的产物，未构建会解析失败
      - name: Build shared
        run: pnpm --filter @cloudmind/shared build

      - name: Test engine and web
        run: pnpm --filter @cloudmind/engine --filter @cloudmind/web test

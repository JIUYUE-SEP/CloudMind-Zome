syntax = "proto3";
package zome;

service ZomeSidecar {
  rpc Upsert(UpsertRequest) returns (UpsertResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc DeleteDocs(DeleteDocsRequest) returns (DeleteDocsResponse);
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message UpsertRequest { string agent_id = 1; string doc_id = 2; repeated float embedding = 3; }
message UpsertResponse {}

message SearchRequest { string agent_id = 1; repeated float query = 2; uint32 top_k = 3; }
message SearchResponse { repeated SearchResult results = 1; }
message SearchResult { string doc_id = 1; float score = 2; }

// M14：按 doc_id 批量删除向量（tombstone 方案，hnsw_rs 不支持物理删点，
// 见 docs/架构文档.md §9.1）——已压缩归档话题的消息向量经此清除
message DeleteDocsRequest { string agent_id = 1; repeated string doc_ids = 2; }
message DeleteDocsResponse {}

message DeleteAgentRequest { string agent_id = 1; }
message DeleteAgentResponse {}

message HealthRequest {}
message HealthResponse { string status = 1; }

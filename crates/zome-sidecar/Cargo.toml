[package]
name = "zome-sidecar"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = "0.13"
prost = "0.13"
tokio = { version = "1.44", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tiktoken-rs = "0.6"
ring = "0.17"
instant-distance = "0.6"
reqwest = { version = "0.12", features = ["json"] }
dirs = "6.0"
base64 = "0.22"
lazy_static = "1.5"

[dev-dependencies]
criterion = "0.5"

[build-dependencies]
tonic-build = "0.13"

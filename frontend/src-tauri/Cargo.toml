[package]
name = "cloudmind-zome"
version = "0.1.0"
description = "CloudMind-Zome Multi-Agent Platform"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = "0.13"
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["jobapi2", "processthreadsapi", "winbase", "winnt"] }

_version: 1
provider:
  default: deepseek
  fallback_chain:
  - deepseek
  - mimo
  - kimicode
  - glm
  deepseek:
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    thinking: enabled
  mimo:
    base_url: https://token-plan-cn.xiaomimimo.com/v1
    api_key: ${tp-c8aw22zg4wyupmmx47034mh0tlmv1wxdacahpggvammfaytz}
  kimicode:
    base_url: https://api.kimi.ai/v1
    api_key: ${KIMICODE_API_KEY}
  glm:
    base_url: https://api.glm.ai/v1
    api_key: ${GLM_API_KEY}
tavily:
  api_key: tvly-test123
assistant_model:
  base_url: ''
  model: ''
  api_key: ''
embedding_model:
  base_url: ''
  model: ''
  api_key: ''
agent:
  max_turns: 50
  identity: agent.identity.yaml
  smart_stop:
    max_turns: 50
    max_tokens: 200000
    timeout_seconds: 600
    no_progress_rounds: 3
    loop_detect_rounds: 2
  tracing:
    enabled: false
    endpoint: http://localhost:4318/v1/traces
context:
  compact_threshold: 0.8
  keep_recent: 3
  hot_memory_limit: 10
  warm_memory_limit: 20
tools:
  toolsets:
  - web
  - file
  - code
  max_result_chars: 12000
  safe_to_parallel_default: true
  default_timeout: 60

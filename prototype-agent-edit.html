<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudMind-Zome - 心智编辑页原型</title>
  <style>
    :root {
      --mc-bg: #0b0f17;
      --mc-text: #d8e1ec;
      --mc-text-secondary: #8899aa;
      --mc-text-tertiary: #5a6a7a;
      --mc-accent: #00e5c9;
      --mc-panel: rgba(255, 255, 255, 0.06);
      --mc-border: rgba(255, 255, 255, 0.08);
      --mc-danger: #ef4444;
      --mc-success: #10b981;
      --mc-warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--mc-bg);
      color: var(--mc-text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    /* 布局 */
    .app-shell {
      height: 100vh;
      overflow: hidden;
    }

    /* 主内容区 - 全宽 */
    .main-content {
      height: 100%;
      overflow-y: auto;
      padding: 32px;
    }

    /* 返回栏 */
    .back-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .back-btn {
      background: transparent;
      border: 1px solid var(--mc-border);
      color: var(--mc-text-secondary);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .back-btn:hover {
      border-color: var(--mc-accent);
      color: var(--mc-accent);
    }
    .page-title {
      font-size: 24px;
      font-weight: 600;
    }
    .agent-id-badge {
      font-size: 12px;
      color: var(--mc-text-tertiary);
      font-family: monospace;
      background: var(--mc-panel);
      padding: 4px 8px;
      border-radius: 4px;
    }

    /* 标签页 */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--mc-border);
      padding-bottom: 12px;
    }
    .tab {
      padding: 10px 20px;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      color: var(--mc-text-secondary);
      font-size: 14px;
      transition: all 0.2s;
      border: 1px solid transparent;
      border-bottom: none;
    }
    .tab:hover {
      color: var(--mc-text);
      background: rgba(255, 255, 255, 0.03);
    }
    .tab.active {
      color: var(--mc-accent);
      background: var(--mc-panel);
      border-color: var(--mc-border);
    }

    /* 表单 */
    .form-section {
      background: var(--mc-panel);
      border: 1px solid var(--mc-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      color: var(--mc-text-secondary);
      margin-bottom: 8px;
    }
    .form-input, .form-textarea, .form-select {
      width: 100%;
      background: rgba(11, 15, 23, 0.6);
      border: 1px solid var(--mc-border);
      color: var(--mc-text);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      outline: none;
      border-color: var(--mc-accent);
    }
    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }
    .form-hint {
      font-size: 12px;
      color: var(--mc-text-tertiary);
      margin-top: 6px;
    }

    /* 工具/技能标签 */
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .tag-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 229, 201, 0.1);
      color: var(--mc-accent);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    .tag-item button {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      opacity: 0.6;
    }
    .tag-item button:hover { opacity: 1; }

    /* 操作按钮 */
    .action-bar {
      display: flex;
      gap: 12px;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--mc-border);
    }
    .btn-primary {
      background: var(--mc-accent);
      color: #0b0f17;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-danger {
      background: transparent;
      color: var(--mc-danger);
      border: 1px solid var(--mc-danger);
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    /* 底部栏 */
    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: rgba(11, 15, 23, 0.9);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--mc-border);
      z-index: 100;
    }
    .bar-left {
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .bar-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(20, 27, 36, 0.7);
      border: 1px solid var(--mc-border);
      color: var(--mc-text-secondary);
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s;
    }
    .bar-avatar:hover { border-color: rgba(0, 229, 201, 0.3); }
    .bar-btn {
      background: transparent;
      border: none;
      color: var(--mc-text-secondary);
      font-size: 14px;
      cursor: pointer;
      padding: 8px 20px;
      transition: color 0.15s;
    }
    .bar-btn:hover { color: var(--mc-accent); }

    /* 原型标注 */
    .prototype-note {
      position: fixed;
      top: 16px;
      right: 16px;
      background: var(--mc-warning);
      color: #0b0f17;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      z-index: 999;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .left-nav { width: 60px; padding: 12px 8px; }
      .nav-header { font-size: 12px; text-align: center; }
      .nav-item { justify-content: center; padding: 12px 8px; }
      .nav-item span { display: none; }
      .main-content { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="prototype-note">原型预览 - 心智编辑页 (/agents/:id/edit)</div>

  <div class="app-shell">
    <!-- 主内容 - 全宽，无导航 -->
    <main class="main-content">
      <!-- 返回栏 -->
      <div class="back-bar">
        <button class="back-btn" onclick="alert('返回列表页 /agents')">← 返回</button>
        <h1 class="page-title">编辑心智</h1>
        <span class="agent-id-badge">test-pipeline-8521f8ea</span>
      </div>

      <!-- 标签页 -->
      <div class="tabs">
        <div class="tab active">基础</div>
        <div class="tab">人设</div>
        <div class="tab">模型</div>
        <div class="tab">技能</div>
        <div class="tab">工具</div>
        <div class="tab">外观</div>
      </div>

      <!-- 基础信息表单 -->
      <div class="form-section">
        <div class="form-group">
          <label class="form-label">ID（不可修改）</label>
          <input type="text" class="form-input" value="test-pipeline-8521f8ea" disabled style="opacity: 0.6;">
          <div class="form-hint">Agent 的唯一标识，创建后不可修改</div>
        </div>

        <div class="form-group">
          <label class="form-label">名称</label>
          <input type="text" class="form-input" value="测试管线" placeholder="给 Agent 起个名字">
        </div>

        <div class="form-group">
          <label class="form-label">代号</label>
          <input type="text" class="form-input" value="TP-001" placeholder="内部代号（可选）">
        </div>

        <div class="form-group">
          <label class="form-label">描述</label>
          <textarea class="form-textarea" placeholder="描述这个 Agent 的用途、性格、能力...">用于测试 ContextPipeline 的验证 Agent，配置了 DeepSeek V4 Flash 模型。</textarea>
        </div>

        <div class="form-group">
          <label class="form-label">标签</label>
          <input type="text" class="form-input" placeholder="按 Enter 添加标签">
          <div class="tag-list">
            <span class="tag-item">测试 <button>×</button></span>
            <span class="tag-item">管线验证 <button>×</button></span>
          </div>
        </div>
      </div>

      <!-- 操作按钮 -->
      <div class="action-bar">
        <button class="btn-primary" onclick="alert('保存成功')">保存</button>
        <button class="btn-danger" onclick="if(confirm('确定删除？此操作不可恢复')) alert('已删除')">删除心智</button>
      </div>
    </main>
  </div>

  <!-- 底部栏 - 仅主页显示，子页面隐藏 -->
  <footer class="bottom-bar" style="display: none;">
    <div class="bar-left">
      <button class="bar-avatar">我</button>
      <button class="bar-btn">心智侧写</button>
      <button class="bar-btn">用户档案</button>
      <button class="bar-btn">算力余量</button>
    </div>
  </footer>
</body>
</html>
